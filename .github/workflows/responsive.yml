name: Responsividad (navegador real)

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "sources/**"
      - "browser_tests/**"
      - "tests/**"
      - ".github/workflows/responsive.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "browser_tests/**"
      - ".github/workflows/responsive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright para pruebas (solo CI)
        timeout-minutes: 3
        run: python -m pip install "playwright>=1.55,<2"
      - name: Preparar dependencias del navegador
        timeout-minutes: 5
        run: python -m playwright install-deps ${{ matrix.browser }}
      - name: Descargar navegador de prueba
        timeout-minutes: 5
        run: python -m playwright install ${{ matrix.browser }}
      - name: Revisar portada y navegación a múltiples tamaños
        env:
          RADAR_TEST_ENGINE: ${{ matrix.browser }}
        run: |
          python - <<'PYTEST'
          import os
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "browser_tests/responsive_smoke.py", os.environ["RADAR_TEST_ENGINE"]], capture_output=True, text=True)
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode:
              detail = (result.stdout + result.stderr)[-5000:]
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Browser smoke failure::{detail}")
          sys.exit(result.returncode)
          PYTEST
      - name: Contadores reales de todo el archivo
        env:
          RADAR_TEST_ENGINE: ${{ matrix.browser }}
        run: |
          python - <<'PYTEST'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "browser_tests/count_regressions.py"], capture_output=True, text=True)
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode:
              detail = (result.stdout + result.stderr)[:6000]
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Archive counter failure::{detail}")
          sys.exit(result.returncode)
          PYTEST
      - name: Lectura y herramientas de agenda
        env:
          RADAR_TEST_ENGINE: ${{ matrix.browser }}
        run: |
          python - <<'PYTEST'
          import subprocess
          import sys
          for suite in ("reading_experience.py", "agenda_tools_regressions.py", "dimension_regressions.py"):
              result = subprocess.run([sys.executable, "browser_tests/" + suite], capture_output=True, text=True)
              print(result.stdout, end="")
              print(result.stderr, end="", file=sys.stderr)
              if result.returncode:
                  detail = (result.stdout + result.stderr)[-6000:]
                  detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={suite}::{detail}")
                  sys.exit(result.returncode)
          PYTEST
      - name: Regresiones de respaldo, Concepción y ayuda de lectura
        if: matrix.browser == 'chromium'
        run: |
          python browser_tests/audit_regressions.py
          python browser_tests/concepcion_regressions.py
          python browser_tests/usability_regressions.py
          python browser_tests/layout_regressions.py
          python browser_tests/homepage_regressions.py
          python browser_tests/agenda_regressions.py
      - name: Guardar capturas para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-${{ matrix.browser }}
          path: |
            test-results/responsive/${{ matrix.browser }}/
            test-results/reading-experience/
            test-results/agenda-tools/
            test-results/dimension/
          if-no-files-found: ignore
          retention-days: 7
