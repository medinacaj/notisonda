name: Vigilar publicación de RadarRRS

on:
  workflow_run:
    workflows: ["Actualizar noticias y publicar"]
    types: [completed]
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: radar-public-health
  cancel-in-progress: false

jobs:
  check-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtener código de main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluar sitio publicado
        id: evaluate
        continue-on-error: true
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
        run: python scripts/check_public_health.py > health-report.txt 2>&1
      - name: Publicar alerta única o cerrar tras recuperarse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_RESULT: ${{ steps.evaluate.outcome }}
        shell: bash
        run: |
          cat health-report.txt
          cat health-report.txt >> "$GITHUB_STEP_SUMMARY"
          issue_title='RadarRRS: alerta automática de publicación'
          open_issue=$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '.[] | select(.title == "RadarRRS: alerta automática de publicación") | .number' | head -n 1)
          if [ "$CHECK_RESULT" != 'success' ]; then
            if [ -z "$open_issue" ]; then
              gh issue create --repo "$GH_REPO" --title "$issue_title" --body-file health-report.txt
            else
              gh issue edit "$open_issue" --repo "$GH_REPO" --body-file health-report.txt
            fi
            exit 1
          fi
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$GH_REPO" --body 'Recuperación verificada: publicación y fuentes dentro de los umbrales.'
            gh issue close "$open_issue" --repo "$GH_REPO" --reason completed
          fi
