name: Validar cambios propuestos

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/checks.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener código propuesto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Validar scripts JavaScript
        run: |
          node --check web/app.js
          node --check web/library.js
          node --check web/sidebar-layout.js
          node --check web/news-effects.js
          node --check web/features.js
          node --check web/sw.js
          node tests/test_sidebar_behavior.cjs
          node tests/test_news_effects.cjs
